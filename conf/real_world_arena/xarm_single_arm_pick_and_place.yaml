name: "real-world-xarm-single-arm-pick-and-place"
robot_ip: "192.168.1.201"
dry_run: False
action_horizon: 20
debug: True
measure_time: True
snap_to_cloth_mask: True
maskout_background: True
use_sim_workspace: False
track_trajectory: False
# Annular reach mask (m from the arm base): tune on hardware (Lite6 reach ~0.44 m).
radius: [0.12, 0.40]
num_eval_trials: 60

# Rectangular ROI in raw camera pixels for the single-arm crop (top-down view).
# Tune to the region reachable by the arm in front of it.
roi_x_min: 700
roi_x_max: 1150
roi_y_min: 10
roi_y_max: 720
