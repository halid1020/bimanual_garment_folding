# conf/transfer_eval/lagarnet/final_lagarnet_reward_v2_alpha_0_3_horizon_ablation.yaml
# Consumed by tool/hydra_horizon_ablation.py, which fixes the planning
# horizons (H = 1, 2, 3, 5) plus an unconstrained-CEM variant in code; this
# file only selects the trained experiment and the evaluation arena.
#
# The script loads the best checkpoint (model_best.pth) of `train_exp_config`
# directly via agent.load_best() (no training) and starts the MPC ablation.
# On Viking this reads <save_root>/final_lagarnet_reward_v2_alpha_0_3/
# checkpoints/model_best.pth, so make sure the transferred checkpoint sits there.

eval_name: transfer_eval_final_lagarnet_reward_v2_alpha_0_3_horizon

train_exp_config: sim_exp/lagarnet/final_lagarnet_reward_v2_alpha_0_3

eval_arenas:
  - arena: lagarnet/multi_longsleeve_single_picker_readjust_pick_provide_semkey_pixel_no_success_stop_resol_128_train_200_horizon_30
    task: lagarnet/flattening_overstretch_penalty_1_no_big_bonus
